<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LTList Admin</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<header class="header">
<h1>ADMIN PANEL</h1>
<p>Kelola data faucet LTList</p>
</header>

<div class="form-grid">

<input id="nama" placeholder="Nama Faucet">
<input id="koin" placeholder="Koin (BTC/ETH/Multi)">
<input id="reward" placeholder="Reward">
<input id="link" placeholder="Link Faucet">
<input id="cooldown" placeholder="Cooldown (menit)">

</div>

<div class="control-panel">
<button onclick="add()">+ Tambah</button>
<button onclick="exportJSON()">Export JSON</button>
</div>

<div id="kotakPesan" class="pesan pesan-info">Admin Ready</div>

<div class="tabel-pembungkus">
<table>
<thead>
<tr>
<th>Nama</th>
<th>Koin</th>
<th>Reward</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="list"></tbody>
</table>
</div>

</div>

<script src="admin.js"></script>

</body>
</html>
