<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LTList MarketCap</title>

<link rel="stylesheet" href="market.css">
</head>

<body>

<div class="header">
  <h1>LTList MarketCap</h1>
  <p>TradingView Style Candlestick</p>

  <input type="text" id="searchBox" placeholder="Search coin..." />
</div>

<div class="container">

<table>
  <thead>
    <tr>
      <th>★</th>
      <th>#</th>
      <th>Coin</th>
      <th>Price</th>
      <th>24h</th>
      <th>Market Cap</th>
    </tr>
  </thead>

  <tbody id="coinTable"></tbody>
</table>

</div>

<!-- CHART MODAL -->
<div id="chartModal" class="modal">
  <div class="modal-content">

    <span class="close" onclick="closeChart()">✖</span>

    <h3 id="chartTitle"></h3>

    <!-- TIMEFRAME BUTTONS -->
    <div class="tf">
      <button onclick="changeTF('1')">1H</button>
      <button onclick="changeTF('1')">1D</button>
      <button onclick="changeTF('7')">7D</button>
      <button onclick="changeTF('30')">30D</button>
    </div>

    <canvas id="candleChart"></canvas>

  </div>
</div>

<script src="market.js"></script>
</body>
</html>
