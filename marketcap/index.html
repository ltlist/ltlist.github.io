<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LTList Binance Clone</title>

<link rel="stylesheet" href="market.css">
</head>

<body>

<div class="header">
  <h2>LTList Exchange Pro</h2>
  <p>Binance Clone Lite</p>
</div>

<div class="container">

  <div class="card">
    <h3>Balance</h3>
    <p>USDT: <b id="usdtBal">1000</b></p>
  </div>

  <div class="card">
    <h3>Market</h3>
    <div id="coinList"></div>
  </div>

  <div class="card">
    <h3>Portfolio</h3>
    <div id="portfolio"></div>
  </div>

  <div class="card">
    <h3>Open Positions</h3>
    <div id="positions"></div>
  </div>

</div>

<script src="market.js"></script>
</body>
</html>
