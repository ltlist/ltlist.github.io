<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LTList Exchange</title>

<link rel="stylesheet" href="market.css">
</head>

<body>

<!-- HEADER -->
<div class="header">
  <h1>LTList Exchange</h1>
  <p>Crypto Market • Live Price</p>
</div>

<!-- MARKET PAGE ONLY -->
<div id="market" class="page active">

  <h2>Market</h2>

  <input id="searchBox" placeholder="Search coin..." oninput="filterCoins()" />

  <div id="coinList"></div>

</div>

<!-- CHART MODAL -->
<div id="chartModal" class="modal">
  <div class="modal-content">

    <span class="close" onclick="closeChart()">✖</span>

    <h3 id="chartTitle"></h3>

    <div class="tf">
      <button onclick="changeTF(1)">1D</button>
      <button onclick="changeTF(7)">7D</button>
      <button onclick="changeTF(30)">30D</button>
    </div>

    <canvas id="candleChart"></canvas>

  </div>
</div>

<!-- BOTTOM NAV (SIMPLE) -->
<div class="bottom-nav">
  <button onclick="showPage('market')">📊 Market</button>
</div>

<script src="market.js"></script>
</body>
</html>
