<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coin Detail</title>

<link rel="stylesheet" href="market.css">
</head>

<body>

<!-- HEADER -->
<div class="header">
  <h1 id="coinName">Loading...</h1>
</div>

<div class="page">

  <!-- PRICE BOX -->
  <div class="card" id="priceBox">
    Loading price...
  </div>

  <!-- TIMEFRAME -->
  <div class="tf">
    <button onclick="setTF(1)">1D</button>
    <button onclick="setTF(7)">7D</button>
    <button onclick="setTF(30)">30D</button>
  </div>

  <!-- CHART (CANDLE + GRID + CROSSHAIR) -->
  <div class="card chart-wrap">
    <canvas id="candleChart"></canvas>
    <canvas id="overlay"></canvas>
  </div>

  <!-- MACD INDICATOR -->
  <div class="card">
    <h3 style="margin-bottom:10px;">MACD Indicator</h3>
    <canvas id="macdChart"></canvas>
  </div>

  <!-- FUNDAMENTAL -->
  <div class="card" id="fundamental">
    Loading fundamentals...
  </div>

</div><!-- END .page -->

<!-- FOOTER -->
  <footer class="footer">
    © LTList Faucet - All rights reserved
  </footer>

<!-- SCRIPT -->
<script src="coin.js"></script>
</body>
</html>
