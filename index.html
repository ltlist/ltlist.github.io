<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LTList Faucet</title>
<link rel="stylesheet" href="/do/zer/style.css">
</head>

<body>

<div class="container">

<header class="header">
<h1>LTList Faucet</h1>
<p>Multi Coin Faucet List</p>
</header>
<center>
<!-- 🔥 ADS 1 (TOP) -->
<div class="ad-banner">
    <span class="ad-label">Advertisement</span>
    <div class="ad-box">
        <iframe 
            src="https://zerads.com/ad/ad.php?width=468&ref=11338"
            width="468"
            height="60"
            scrolling="no"
            frameborder="0"
            marginwidth="0"
            marginheight="0">
        </iframe>
    </div>
</div></center>

<!-- CONTROL -->
<div class="control-panel">

<input id="search" placeholder="🔍 Cari faucet">

<select id="filterKoin">
<option value="all">All Coin</option>
<option value="MULTI">MULTI</option>
<option value="LTC">LTC</option>
<option value="DOGE">DOGE</option>
<option value="USDT">USDT</option>
<option value="ZER">ZER</option>
</select>

<button id="sortBtn">Sort</button>

</div>

<!-- STATUS -->
<div id="kotakPesan" class="pesan pesan-info">Loading data...</div>

<!-- TABLE -->
<div class="tabel-pembungkus">
<table>
<thead>
<tr>
<th>No</th>
<th>Nama</th>
<th>Coin</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="isiTabel"></tbody>
</table>
</div>
<center>
<!-- 🔥 ADS 2 (BOTTOM) -->
<div class="ad-banner">
    <span class="ad-label">Advertisement</span>
    <div class="ad-box">
        <iframe 
            src="https://zerads.com/ad/ad.php?width=468&ref=11338"
            width="468"
            height="60"
            scrolling="no"
            frameborder="0"
            marginwidth="0"
            marginheight="0">
        </iframe>
    </div>
</div>
</center>
<!-- FOOTER -->
<footer class="footer">
            <p>© <span id="tahunSekarang"></span> LTList | Faucetlist</p>
        </footer>

</div>

<script src="do/main/script.js"></script>

</body>
</html>
