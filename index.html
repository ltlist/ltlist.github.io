<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LTList • Koleksi Faucet Terbaik</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header class="header">
    <h1>LTList</h1>
    <p>Daftar faucet kripto terpercaya, terbukti membayar!</p>
  </header>

    <div class="container">
    <div class="filter-box">
      <div id="filterContainer" class="radio-list"></div>
    </div>

    <table id="faucetTable">
      <thead>
        <tr>
          <th>No</th>
          <th>Faucet Name</th>
          <th>Coin</th>
          <th>Trust</th>
          <th>Claim Value</th>
        </tr>
      </thead>
      <tbody id="faucetList"></tbody>
    </table>
  </div>
  <footer class="kaki">
    <p>© 2026 LTList • Semua tautan terverifikasi & aman</p>
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
