<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="judulSitus">LTList • Koleksi Faucet Terbaik</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Bagian Header -->
        <header class="header">
            <h1 id="judulUtama">LTList</h1>
            <p id="deskripsiSitus">Memuat informasi...</p>
        </header>

        <!-- Pesan Status -->
        <div id="kotakPesan" class="pesan pesan-info">🔄 Sedang memuat daftar faucet...</div>

        <!-- Tabel Daftar Faucet -->
        <div class="tabel-pembungkus">
            <table id="tabelFaucet">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Faucet</th>
                        <th>Koin</th>
                        <th>Kepercayaan</th>
                        <th>Perkiraan Hadiah</th>
                        <th>Klaim</th>
                    </tr>
                </thead>
                <tbody id="isiTabel">
                    <tr>
                        <td colspan="6" class="teks-tengah">Menunggu data dimuat...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Bagian Footer -->
        <footer class="footer">
            <p>© <span id="tahunSekarang"></span> LTList | Semua daftar terverifikasi & terbukti membayar</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
