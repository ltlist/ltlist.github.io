<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LTList Faucet</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<header class="header">
<h1>LTList Faucet</h1>
<p>Crypto faucet list with fast updates</p>
</header>

<!-- CONTROL -->
<div class="control-panel">

<input id="search" placeholder="Search faucet...">

<select id="filter">
<option value="all">All Coin</option>
<option value="LTC">LTC</option>
<option value="DOGE">DOGE</option>
<option value="USDT">USDT</option>
<option value="ZER">ZER</option>
<option value="MULTI">MULTI</option>
</select>

<button id="sortBtn">Sort</button>

</div>

<!-- STATUS -->
<div id="status">Loading...</div>

<!-- TABLE -->
<div class="tabel-pembungkus">
<table>
<thead>
<tr>
<th>No</th>
<th>Nama</th>
<th>Coin</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="tbody"></tbody>
</table>
</div>

<footer class="footer">
© LTList Faucet
</footer>

</div>

<script src="script.js"></script>

</body>
</html>
