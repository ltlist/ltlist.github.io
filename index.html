<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LTList Faucet PRO</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<header class="header">
<h1>LTList Faucet PRO</h1>
<p>Smart Faucet Dashboard • LIVE / SLOW / DEAD Checker</p>
</header>

<!-- CONTROL -->
<div class="control-panel">

<input id="search" type="text" placeholder="Search faucet...">

<select id="filterKoin">
<option value="all">All Coin</option>
<option value="LTC">LTC</option>
<option value="DOGE">DOGE</option>
<option value="USDT">USDT</option>
<option value="ZER">ZER</option>
<option value="MULTI">MULTI</option>
</select>

<button id="sortBtn">Sort A-Z</button>

</div>

<!-- STATUS -->
<div id="kotakPesan" class="status-box">
Loading data...
</div>

<!-- TABLE -->
<div class="table-wrap">
<table>
<thead>
<tr>
<th>No</th>
<th>Nama</th>
<th>Coin</th>
<th>Aksi</th>
<th>Status</th>
</tr>
</thead>

<tbody id="isiTabel"></tbody>
</table>
</div>

<footer class="footer">
© LTList Faucet PRO - Smart Monitoring System
</footer>

</div>

<script src="script.js"></script>

</body>
</html>
