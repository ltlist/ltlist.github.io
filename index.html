<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LTList Faucet</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<header class="header">
<h1>LTList Faucet</h1>
<p>Auto Sync Google Sheets Faucet List</p>
</header>

<div class="control-panel">

<input id="search" placeholder="Search faucet...">

<select id="filterKoin">
<option value="all">All Coin</option>
<option value="LTC">LTC</option>
<option value="DOGE">DOGE</option>
<option value="USDT">USDT</option>
<option value="ZER">ZER</option>
<option value="MULTI">MULTI</option>
</select>

<button id="sortBtn">Sort</button>

</div>

<div id="kotakPesan">Loading data...</div>

<table>
<thead>
<tr>
<th>No</th>
<th>Name</th>
<th>Coin</th>
<th>Action</th>
</tr>
</thead>

<tbody id="isiTabel"></tbody>
</table>

</div>

<script src="script.js"></script>

</body>
</html>
