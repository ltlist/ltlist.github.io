<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Faucet Kripto Terpercaya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        dark: '#0F172A',
                        light: '#F8FAFC'
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .card-hover {
                transition: all 0.3s ease;
            }
            .card-hover:hover {
                transform: translateY(-3px);
                box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            }
        }
    </style>
</head>
<body class="font-inter bg-slate-50 text-slate-800">
    <!-- Header -->
    <header class="bg-gradient-to-r from-primary to-blue-700 text-white py-8 px-4">
        <div class="container mx-auto max-w-6xl">
            <h1 class="text-3xl md:text-4xl font-bold mb-2">💧 Daftar Faucet Kripto</h1>
            <p class="text-blue-100 text-lg">Kumpulan situs faucet terpercaya untuk mendapatkan kripto gratis</p>
        </div>
    </header>

    <!-- Filter & Pencarian -->
    <div class="bg-white shadow-sm py-4 px-4 sticky top-0 z-10">
        <div class="container mx-auto max-w-6xl flex flex-col md:flex-row gap-4 justify-between items-center">
            <div class="flex gap-2">
                <button class="px-4 py-2 bg-primary text-white rounded-lg text-sm filter-btn active" data-filter="semua">Semua</button>
                <button class="px-4 py-2 bg-slate-100 rounded-lg text-sm filter-btn" data-filter="btc">Bitcoin</button>
                <button class="px-4 py-2 bg-slate-100 rounded-lg text-sm filter-btn" data-filter="eth">Ethereum</button>
                <button class="px-4 py-2 bg-slate-100 rounded-lg text-sm filter-btn" data-filter="doge">Dogecoin</button>
                <button class="px-4 py-2 bg-slate-100 rounded-lg text-sm filter-btn" data-filter="lainnya">Lainnya</button>
            </div>
            <div class="relative w-full md:w-64">
                <input type="text" id="search" placeholder="Cari nama faucet..." class="w-full px-4 py-2 border border-slate-200 rounded-lg pl-10">
                <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            </div>
        </div>
    </div>

    <!-- Daftar Faucet (akan diisi otomatis dari file lain) -->
    <main class="container mx-auto max-w-6xl py-8 px-4">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="faucetList">
            <!-- Konten muncul dari data-faucet.js -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 text-slate-400 py-8 px-4">
        <div class="container mx-auto max-w-6xl text-center">
            <p>&copy; 2026 Daftar Faucet Kripto | Website gratis di GitHub.io</p>
            <p class="text-sm mt-2">Catatan: Situs ini hanya sebagai informasi, kami tidak bertanggung jawab atas layanan pihak ketiga</p>
        </div>
    </footer>

    <!-- Panggil file data faucet -->
    <script src="data-faucet.js"></script>
</body>
</html>
