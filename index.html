<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LTList Faucet</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<header class="header">
<h1>LTList</h1>
<p>Faucet Multi Coin</p>
</header>

<div class="control-panel">

<input id="search" placeholder="🔍 Cari faucet">

<select id="filterKoin">
<option value="all">Semua Coin</option>
<option value="LTC">LTC</option>
<option value="DOGE">DOGE</option>
<option value="USDT">USDT</option>
<option value="ZER">ZER</option>
</select>

<button id="sortBtn">Sort</button>

</div>

<div id="kotakPesan" class="pesan pesan-info">Loading...</div>

<div class="tabel-pembungkus">
<table>
<thead>
<tr>
<th>No</th>
<th>Nama</th>
<th>Coin</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="isiTabel"></tbody>
</table>
</div>

<footer class="footer">
© LTList Faucet
</footer>

</div>

<script src="script.js"></script>

</body>
</html>
