<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LTList Faucet</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<header class="header">
<h1>LTList</h1>
<p>Daftar faucet otomatis dari GitHub</p>
</header>

<div class="control-panel">
<input id="search" placeholder="🔍 Cari faucet">
<select id="filterKoin">
<option value="all">Semua</option>
<option value="BTC">BTC</option>
<option value="ETH">ETH</option>
<option value="Multi">Multi</option>
</select>
<button id="sortBtn">Sort</button>
</div>

<div id="kotakPesan" class="pesan pesan-info">Loading...</div>

<div class="tabel-pembungkus">
<table>
<thead>
<tr>
<th>No</th>
<th>Nama</th>
<th>Koin</th>
<th>Reward</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="isiTabel"></tbody>
</table>
</div>

<footer class="footer">
© <span id="tahun"></span> LTList
</footer>

</div>

<script src="script.js"></script>

<script>
document.getElementById("tahun").textContent = new Date().getFullYear();
</script>

</body>
</html>
