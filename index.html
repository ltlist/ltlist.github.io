<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="judulSitus">LTList • Koleksi Faucet Terbaik</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <header class="header">
    <h1 id="judulUtama">LTList</h1>
    <p id="deskripsiSitus">Memuat daftar faucet...</p>
  </header>

  <div id="kotakInfo" class="kotak pesan-info">🔄 Sedang menyiapkan data...</div>

  <div class="bungkus-tabel">
    <table id="tabelUtama">
      <thead>
        <tr>
          <th>No</th>
          <th>Nama Faucet</th>
          <th>Koin</th>
          <th>Kepercayaan</th>
          <th>Hadiah & Waktu</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="isiTabel">
        <tr><td colspan="6" class="teks-tengah">Menunggu data dimuat...</td></tr>
      </tbody>
    </table>
  </div>

  <footer class="kaki">
    <p>© <span id="tahun"></span> LTList • Semua tautan terverifikasi & aman</p>
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
