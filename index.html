<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faucet List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Filter Koin -->
    <div class="filter-box">
      <div id="filterContainer" class="radio-list"></div>
    </div>

    <!-- Tabel Daftar Faucet -->
    <table id="faucetTable">
      <thead>
        <tr>
          <th>No</th>
          <th>Faucet Name</th>
          <th>Coin</th>
          <th>Trust</th>
          <th>Claim Value</th>
        </tr>
      </thead>
      <tbody id="faucetList"></tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
