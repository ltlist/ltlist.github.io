<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List Faucet Claim Gratis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#165DFF',
            dark: '#1D2129',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto { content-visibility: auto; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
    }
  </style>
</head>
<body class="bg-gray-50 font-sans text-dark min-h-screen">

  <!-- HEADER -->
  <header class="bg-primary text-white shadow-md">
    <div class="container mx-auto px-4 py-6">
      <h1 class="text-[clamp(1.5rem,3vw,2.5rem)] font-bold text-center">
        <i class="fa fa-coins mr-2"></i> List Faucet Claim Gratis
      </h1>
      <p class="text-center text-white/80 mt-1">Kumpulan situs claim kripto terbaru & terpercaya</p>
    </div>
  </header>

  <!-- KONTEN UTAMA -->
  <main class="container mx-auto px-4 py-8">

    <!-- STATUS INFO -->
    <div class="bg-blue-50 border border-blue-100 rounded-lg p-4 mb-8 text-center">
      <p class="text-blue-700 text-sm">
        <i class="fa fa-info-circle mr-1"></i> 
        Total <span id="jumlahData">0</span> Faucet tersedia • Claim ulang sesuai waktu cooldown
      </p>
    </div>

    <!-- DAFTAR FAUCET -->
    <div id="listFaucet" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
      <div class="col-span-full text-center py-10 text-gray-500">
        <i class="fa fa-spinner fa-spin text-3xl mb-3"></i>
        <p>Memuat daftar faucet...</p>
      </div>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="bg-gray-100 border-t py-6 mt-12">
    <div class="container mx-auto px-4 text-center text-gray-500 text-xs">
      <p>© 2026 List Faucet Gratis | Data diupdate secara berkala</p>
    </div>
  </footer>

  <script>
    // AMBIL DATA DARI PENYIMPANAN YANG SAMA DENGAN HALAMAN ADMIN
    let daftarFaucet = [];

    window.onload = () => {
      // Ambil data yang disimpan oleh halaman /gobang
      const simpanan = localStorage.getItem("dataFaucet");
      if (simpanan) {
        daftarFaucet = JSON.parse(simpanan);
      }
      muatDataPublik();
    };

    // 📌 TAMPILAN PUBLIK
    function muatDataPublik() {
      document.getElementById('jumlahData').innerText = daftarFaucet.length;
      const wadah = document.getElementById('listFaucet');
      wadah.innerHTML = "";

      if (daftarFaucet.length === 0) {
        wadah.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500">Belum ada data faucet.</div>`;
        return;
      }

      daftarFaucet.forEach(item => {
        const kartu = document.createElement('div');
        kartu.className = "bg-white rounded-lg shadow hover:shadow-md transition p-4 border border-gray-100 flex flex-col justify-between";
        kartu.innerHTML = `
          <div>
            <h3 class="font-bold text-lg text-gray-800 mb-1">${item[1]}</h3>
            <p class="text-sm text-gray-500 mb-2">Koin: <span class="font-medium text-primary">${item[2]}</span></p>
            <p class="text-xs text-gray-400 mb-4">Cooldown: ${item[4]} menit</p>
          </div>
          <a href="${item[3]}" target="_blank" rel="noopener noreferrer" 
             class="block w-full text-center bg-green-600 hover:bg-green-700 text-white font-medium py-2 rounded transition">
            <i class="fa fa-external-link mr-1"></i> CLAIM NOW
          </a>
        `;
        wadah.appendChild(kartu);
      });
    }
  </script>
</body>
</html>
