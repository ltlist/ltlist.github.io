<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin LTList</title>
 <meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="container">

<header class="header">
<h1>ADMIN PANEL</h1>
<p>Add Faucet</p>
</header>

<div class="form-grid">

<input id="nama" placeholder="Nama Faucet">

<select id="koin">
<option>MULTI</option>
<option>LTC</option>
<option>DOGE</option>
<option>USDT</option>
<option>ZER</option>
</select>

<input id="link" placeholder="Link Faucet">
<input id="cooldown" placeholder="Cooldown (menit)">

</div>

<div class="control-panel">
<button onclick="add()">+ Tambah</button>
<button onclick="exportJSON()">Export JSON</button>
</div>

<div class="tabel-pembungkus">
<table>
<thead>
<tr>
<th>Nama</th>
<th>Coin</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="list"></tbody>
</table>
</div>

</div>

<script src="site.js"></script>

</body>
</html>
