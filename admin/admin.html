<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LTList Admin PRO</title>
 <meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="container">

<header class="header">
<h1>LTList Admin PRO</h1>
<p>Faucet CMS • SaaS Ready Panel</p>
</header>

<!-- LOGIN -->
<div id="loginBox" class="card">

<h2>Admin Login</h2>

<input type="password" id="pass" placeholder="Password">

<button onclick="login()">Login</button>

<p id="msg"></p>

</div>

<!-- PANEL -->
<div id="panel" style="display:none;">

<div class="card">

<h2>Faucet Editor</h2>

<input id="nama" placeholder="Nama faucet">

<select id="koin">
<option>MULTI</option>
<option>LTC</option>
<option>DOGE</option>
<option>USDT</option>
<option>ZER</option>
</select>

<input id="link" placeholder="Link faucet">

<input id="cooldown" type="number" placeholder="Cooldown (menit)">

<div class="actions">

<button onclick="save()">Save</button>
<button onclick="resetForm()">Reset</button>
<button onclick="exportJSON()">Export JSON</button>

</div>

</div>

<div class="card">

<h2>Search</h2>

<input id="search" oninput="render()" placeholder="Cari faucet">

</div>

<div class="card">

<h2>Faucet List</h2>

<div class="table-wrap">

<table>
<thead>
<tr>
<th>No</th>
<th>Nama</th>
<th>Coin</th>
<th>Cooldown</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="list"></tbody>
</table>

</div>

</div>

</div>

</div>

<script src="admin.js"></script>

</body>
</html>
