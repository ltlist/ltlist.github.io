<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jabrig Admin Panel</title>

<style>
body{
  font-family:Arial;
  background:#111;
  color:#fff;
  padding:10px;
}

/* LOGIN */
#loginBox{
  max-width:320px;
  margin:100px auto;
  background:#1c1c1c;
  padding:20px;
  border-radius:10px;
  text-align:center;
}

input,select,button{
  padding:10px;
  margin:5px;
  border-radius:6px;
  border:none;
  font-size:14px;
  width: 90%;
  margin-bottom: 8px;
}

button{
  cursor:pointer;
}

.btn{
  background:green;
  color:#fff;
}

/* DASHBOARD */
#dashboard{
  display:none;
}

h2{
  text-align:center;
}

/* FORM */
.form-box{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:8px;
}

/* TABLE */
.table-container{
  overflow-x:auto;
}

table{
  width:100%;
  min-width:600px;
  border-collapse:collapse;
  margin-top:10px;
}

th,td{
  border:1px solid #444;
  padding:8px;
  font-size:13px;
}

#editBox{
  display:none;
  background:#222;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
}

.btn-del{background:red;color:#fff;}
.btn-edit{background:orange;}

#msg {
  color: #ff6b6b;
  font-size: 13px;
}
</style>

<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js"></script>

</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <h2>🔐 Admin Login</h2>
  <input type="email" id="email" placeholder="Email Admin">
  <input type="password" id="pass" placeholder="Kata Sandi">
  <button class="btn" onclick="login()">Login</button>
  <p id="msg"></p>
</div>

<!-- DASHBOARD -->
<div id="dashboard">

<h2>🔥 Jabrig Admin Panel</h2>

<div class="form-box">
  <input id="name" placeholder="Name">

  <select id="coin">
    <option value="LTC">LTC</option>
    <option value="ZER">ZER</option>
    <option value="DOGE">DOGE</option>
    <option value="USDT">USDT</option>
    <option value="MULTI">MULTI</option>
  </select>

  <input id="link" placeholder="Link">
  <input id="cooldown" placeholder="Cooldown">

  <button class="btn" onclick="addData()">➕ Add</button>
  <button onclick="logout()">Logout</button>
</div>

<!-- EDIT -->
<div id="editBox">
  <h3>Edit Data</h3>

  <input id="eid" placeholder="ID">
  <input id="ename" placeholder="Name">

  <select id="ecoin">
    <option value="LTC">LTC</option>
    <option value="ZER">ZER</option>
    <option value="DOGE">DOGE</option>
    <option value="USDT">USDT</option>
    <option value="MULTI">MULTI</option>
  </select>

  <input id="elink" placeholder="Link">
  <input id="ecooldown" placeholder="Cooldown">

  <button class="btn" onclick="updateData()">💾 Save</button>
</div>

<div class="table-container">
  <table id="table"></table>
</div>

</div>

<script>

// ===== KONFIGURASI FIREBASE (SUDAH DIISI SESUAI PUNYA KAMU) =====
const firebaseConfig = {
  apiKey: "AIzaSyAVokWj_l3aITEhj6UPetF-MGQXKdv75S8",
  authDomain: "ltlist-f.firebaseapp.com",
  projectId: "ltlist-f",
  storageBucket: "ltlist-f.firebasestorage.app",
  messagingSenderId: "991011425656",
  appId: "1:991011425656:web:d8f4da4e5c4b4ab9aacc8d"
};

// Inisialisasi Firebase
const app = firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// ===== API GOOGLE SHEETS (TETAP SAMA) =====
const API = "https://script.google.com/macros/s/AKfycbw8NvblgJJ6EOvjWRgHkizjWCGid0BjxTrhrgkw7C7R2QHIkF6DgoVkOxo42Hv4kGQ8/exec";

let editRow = null;

/* ================= AUTO LOGIN ================= */
window.onload = function(){
  // Cek status login Firebase
  auth.onAuthStateChanged(user => {
    if (user) {
      showDashboard();
    }
  });
}

/* ================= LOGIN DENGAN FIREBASE ================= */
async function login(){
  let email = document.getElementById("email").value;
  let pass = document.getElementById("pass").value;
  let msg = document.getElementById("msg");

  msg.innerText = "";

  if(!email || !pass) return msg.innerText = "❌ Isi email & sandi";

  try {
    await auth.signInWithEmailAndPassword(email, pass);
    msg.innerText = "✅ Berhasil masuk...";
  } catch (error) {
    console.error(error);
    if(error.code === "auth/user-not-found") msg.innerText = "❌ Email tidak terdaftar";
    else if(error.code === "auth/wrong-password") msg.innerText = "❌ Sandi salah";
    else if(error.code === "auth/invalid-email") msg.innerText = "❌ Format email salah";
    else msg.innerText = "❌ " + error.message;
  }
}

/* ================= SHOW DASHBOARD ================= */
function showDashboard(){
  document.getElementById("loginBox").style.display="none";
  document.getElementById("dashboard").style.display="block";
  load();
}

/* ================= LOGOUT ================= */
async function logout(){
  await auth.signOut();
  location.reload();
}

/* ================= LOAD DATA (TETAP SAMA) ================= */
async function load(){
  let res = await fetch(API);
  let text = await res.text();
  let data = JSON.parse(text);

  let html = `
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Coin</th>
    <th>Link</th>
    <th>Cooldown</th>
    <th>Action</th>
  </tr>`;

  data.forEach(d=>{
    html += `
    <tr>
      <td>${d.id}</td>
      <td>${d.name}</td>
      <td>${d.coin}</td>
      <td>${d.link}</td>
      <td>${d.cooldown}</td>
      <td>
        <button class="btn-edit" onclick='edit(${JSON.stringify(d)})'>Edit</button>
        <button class="btn-del" onclick="hapus(${d.row})">Delete</button>
      </td>
    </tr>`;
  });

  document.getElementById("table").innerHTML = html;
}

/* ================= ADD DATA (TETAP SAMA) ================= */
async function addData(){

  let form = new FormData();
  form.append("action","add");

  form.append("name",document.getElementById("name").value);
  form.append("coin",document.getElementById("coin").value);
  form.append("link",document.getElementById("link").value);
  form.append("cooldown",document.getElementById("cooldown").value);

  await fetch(API,{method:"POST",body:form});

  document.getElementById("name").value="";
  document.getElementById("link").value="";
  document.getElementById("cooldown").value="";

  load();
}

/* ================= DELETE (TETAP SAMA) ================= */
async function hapus(row){

  let form = new FormData();
  form.append("action","delete");
  form.append("row",row);

  await fetch(API,{method:"POST",body:form});
  load();
}

/* ================= EDIT (TETAP SAMA) ================= */
function edit(d){

  editRow = d.row;

  document.getElementById("editBox").style.display="block";

  document.getElementById("eid").value = d.id;
  document.getElementById("ename").value = d.name;
  document.getElementById("ecoin").value = d.coin;
  document.getElementById("elink").value = d.link;
  document.getElementById("ecooldown").value = d.cooldown;
}

/* ================= UPDATE (TETAP SAMA) ================= */
async function updateData(){

  let form = new FormData();
  form.append("action","update");

  form.append("row",editRow);
  form.append("id",document.getElementById("eid").value);
  form.append("name",document.getElementById("ename").value);
  form.append("coin",document.getElementById("ecoin").value);
  form.append("link",document.getElementById("elink").value);
  form.append("cooldown",document.getElementById("ecooldown").value);

  await fetch(API,{method:"POST",body:form});

  document.getElementById("editBox").style.display="none";
  load();
}

</script>

</body>
</html>
