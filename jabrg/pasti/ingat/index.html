<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Jabrig Admin</title>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="loginBox">

<h2>Login Admin</h2>

<input type="email" id="email" placeholder="Email">
<br><br>

<input type="password" id="pass" placeholder="Password">
<br><br>

<button onclick="login()">Login</button>

<p id="msg"></p>

</div>

<div id="dashboard" style="display:none;">

<h2>Jabrig Admin Panel</h2>

<p id="userInfo"></p>

<button onclick="logout()">Logout</button>

<hr>

<input id="name" placeholder="Name">
<br><br>

<select id="coin">
<option>LTC</option>
<option>DOGE</option>
<option>ZER</option>
<option>USDT</option>
<option>MULTI</option>
</select>

<br><br>

<input id="link" placeholder="Link">
<br><br>

<input id="cooldown" type="number" placeholder="Cooldown">
<br><br>

<button onclick="addData()">Tambah Data</button>

</div>

<script>

// FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyAVokWj_l3aITEhj6UPetF-MGQXKdv75S8",
  authDomain: "ltlist-f.firebaseapp.com",
  projectId: "ltlist-f",
  storageBucket: "ltlist-f.firebasestorage.app",
  messagingSenderId: "991011425656",
  appId: "1:991011425656:web:d8f4da4e5c4b4ab9aacc8d"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const API = "URL_APPS_SCRIPT_KAMU";

// AUTO LOGIN
auth.onAuthStateChanged(user => {

  if(user){

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

    document.getElementById("userInfo").innerText =
      "Login sebagai: " + user.email;

  }else{

    document.getElementById("loginBox").style.display = "block";
    document.getElementById("dashboard").style.display = "none";

  }

});

// LOGIN
async function login(){

  const email = document.getElementById("email").value;
  const pass = document.getElementById("pass").value;

  try{

    await auth.signInWithEmailAndPassword(email, pass);

    document.getElementById("msg").innerText =
      "Login berhasil";

  }catch(err){

    document.getElementById("msg").innerText =
      err.message;

  }

}

// LOGOUT
async function logout(){

  await auth.signOut();

}

// CEK LOGIN
function checkLogin(){

  if(!auth.currentUser){

    alert("Silakan login");

    return false;

  }

  return true;

}

// ADD DATA
async function addData(){

  if(!checkLogin()) return;

  const form = new FormData();

  form.append("action","add");
  form.append("name",document.getElementById("name").value);
  form.append("coin",document.getElementById("coin").value);
  form.append("link",document.getElementById("link").value);
  form.append("cooldown",document.getElementById("cooldown").value);

  try{

    await fetch(API,{
      method:"POST",
      body:form
    });

    alert("Data berhasil ditambah");

  }catch(err){

    alert(err.message);

  }

}

</script>

</body>
</html>
