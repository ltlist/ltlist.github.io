<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Jabrig Admin Panel</title><link rel="stylesheet" href="style.css">
</head><body><!-- LOGIN --><div id="loginBox">  <h2>🔐 Admin Login</h2><input
type="email"
id="email"
placeholder="Email Admin">

<input
type="password"
id="pass"
placeholder="Password">

<button
class="btn"
onclick="login()">
Login
</button>

  <p id="msg"></p></div><!-- DASHBOARD --><div id="dashboard">  <h2>🔥 Jabrig Admin Panel</h2>  <div class="form-box"><input
  id="name"
  placeholder="Name">

<select id="coin">
  <option value="LTC">LTC</option>
  <option value="ZER">ZER</option>
  <option value="DOGE">DOGE</option>
  <option value="USDT">USDT</option>
  <option value="MULTI">MULTI</option>
</select>

<input
  id="link"
  placeholder="Link Faucet">

<input
  id="cooldown"
  type="number"
  placeholder="Cooldown">

<button
  class="btn"
  onclick="addData()">
  ➕ Add
</button>

<button
  onclick="logout()">
  Logout
</button>

  </div>  <!-- EDIT BOX -->  <div id="editBox"><h3>Edit Data</h3>

<input
  id="eid"
  placeholder="ID">

<input
  id="ename"
  placeholder="Name">

<select id="ecoin">
  <option value="LTC">LTC</option>
  <option value="ZER">ZER</option>
  <option value="DOGE">DOGE</option>
  <option value="USDT">USDT</option>
  <option value="MULTI">MULTI</option>
</select>

<input
  id="elink"
  placeholder="Link Faucet">

<input
  id="ecooldown"
  type="number"
  placeholder="Cooldown">

<button
  class="btn"
  onclick="updateData()">
  💾 Save
</button>

  </div>  <!-- TABLE -->  <div class="table-container"><table id="table">

  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Coin</th>
    <th>Link</th>
    <th>Cooldown</th>
    <th>Action</th>
  </tr>

</table>

  </div></div><script src="script.js"></script></body>
</html>
