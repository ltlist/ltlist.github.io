<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Jabrig Admin</title>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<link rel="stylesheet" href="style.css">
</head>

<body>
    
<!-- LOGIN -->
<div id="loginBox">

<h2>Login Admin</h2>

<input type="email" id="email" placeholder="Email">
<br><br>

<input type="password" id="pass" placeholder="Password">
<br><br>

<button onclick="login()">Login</button>

<p id="msg"></p>

</div>
<!-- DASHBOARD -->
<div id="dashboard" style="display:none;">

<h2>Jabrig Admin Panel</h2>

<p id="userInfo"></p>
<div class="form-box">
  <input id="name" placeholder="Name">

  <select id="coin">
    <option value="LTC">LTC</option>
    <option value="ZER">ZER</option>
    <option value="DOGE">DOGE</option>
    <option value="USDT">USDT</option>
    <option value="MULTI">MULTI</option>
  </select>

  <input id="link" placeholder="Link">
  <input id="cooldown" placeholder="Cooldown">

  <button class="btn" onclick="addData()">➕ Add</button>
  <button onclick="logout()">Logout</button>
</div>
<!-- EDIT -->
<div id="editBox">
  <h3>Edit Data</h3>

  <input id="eid" placeholder="ID">
  <input id="ename" placeholder="Name">

  <select id="ecoin">
    <option value="LTC">LTC</option>
    <option value="ZER">ZER</option>
    <option value="DOGE">DOGE</option>
    <option value="USDT">USDT</option>
    <option value="MULTI">MULTI</option>
  </select>

  <input id="elink" placeholder="Link">
  <input id="ecooldown" placeholder="Cooldown">

  <button class="btn" onclick="updateData()">💾 Save</button>
</div>

<div class="table-container">
  <table id="table"></table>
</div>

</div>
<script>
// FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyAVokWj_l3aITEhj6UPetF-MGQXKdv75S8",
  authDomain: "ltlist-f.firebaseapp.com",
  projectId: "ltlist-f",
  storageBucket: "ltlist-f.firebaseapp.com",
  messagingSenderId: "991011425656",
  appId: "1:991011425656:web:d8f4da4e5c4b4ab9aacc8d"
};

/* ================= FIREBASE SAFE INIT ================= */
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();

const API = "https://script.google.com/macros/s/AKfycbw8NvblgJJ6EOvjWRgHkizjWCGid0BjxTrhrgkw7C7R2QHIkF6DgoVkOxo42Hv4kGQ8/exec";

let editRow = null;

/* ================= LOGIN PERSISTENCE ================= */
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

/* ================= UI STATE ================= */
function showLogin(){
  document.getElementById("loginBox").style.display = "block";
  document.getElementById("dashboard").style.display = "none";
}

function showDashboard(user){
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("dashboard").style.display = "block";

  document.getElementById("userInfo").innerText =
    "Login sebagai: " + user.email;
}

/* ================= AUTH LISTENER (ANTI FLICKER) ================= */
document.getElementById("loading")?.style && 
(document.getElementById("loading").style.display = "block");

auth.onAuthStateChanged(async (user) => {

  document.getElementById("loading")?.remove();

  if(user){

    showDashboard(user);

    await load(); // 🔥 load langsung setelah ready

  }else{

    showLogin();

  }

});

/* ================= LOGIN ================= */
async function login(){

  const email = document.getElementById("email").value;
  const pass = document.getElementById("pass").value;

  try{
    await auth.signInWithEmailAndPassword(email, pass);
  }catch(err){
    document.getElementById("msg").innerText = err.message;
  }
}

/* ================= LOGOUT ================= */
async function logout(){
  await auth.signOut();
}

/* ================= LOAD DATA (SAFE) ================= */
async function load(){

  try{

    const res = await fetch(API);
    const text = await res.text();

    if(!text || text.trim() === "") return;

    const data = JSON.parse(text);

    let html = `
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Coin</th>
      <th>Link</th>
      <th>Cooldown</th>
      <th>Action</th>
    </tr>`;

    data.forEach(d => {
      html += `
      <tr>
        <td>${d.id}</td>
        <td>${d.name}</td>
        <td>${d.coin}</td>
        <td>${d.link}</td>
        <td>${d.cooldown}</td>
        <td>
          <button onclick='edit(${JSON.stringify(d)})'>Edit</button>
          <button onclick='hapus(${d.row})'>Delete</button>
        </td>
      </tr>`;
    });

    document.getElementById("table").innerHTML = html;

  }catch(err){
    console.log("LOAD ERROR:", err);
  }
}

/* ================= ADD ================= */
async function addData(){

  if(!auth.currentUser) return;

  const form = new FormData();

  form.append("action","add");
  form.append("name",document.getElementById("name").value);
  form.append("coin",document.getElementById("coin").value);
  form.append("link",document.getElementById("link").value);
  form.append("cooldown",document.getElementById("cooldown").value);

  await fetch(API,{method:"POST",body:form});

  await load();
}

/* ================= DELETE ================= */
async function hapus(row){

  if(!auth.currentUser) return;

  const form = new FormData();
  form.append("action","delete");
  form.append("row",row);

  await fetch(API,{method:"POST",body:form});

  await load();
}

/* ================= EDIT ================= */
window.edit = function(d){

  editRow = d.row;

  document.getElementById("editBox").style.display = "block";

  document.getElementById("eid").value = d.id;
  document.getElementById("ename").value = d.name;
  document.getElementById("ecoin").value = d.coin;
  document.getElementById("elink").value = d.link;
  document.getElementById("ecooldown").value = d.cooldown;
};

/* ================= UPDATE ================= */
async function updateData(){

  if(!auth.currentUser) return;

  const form = new FormData();

  form.append("action","update");
  form.append("row",editRow);
  form.append("id",document.getElementById("eid").value);
  form.append("name",document.getElementById("ename").value);
  form.append("coin",document.getElementById("ecoin").value);
  form.append("link",document.getElementById("elink").value);
  form.append("cooldown",document.getElementById("ecooldown").value);

  await fetch(API,{method:"POST",body:form});

  document.getElementById("editBox").style.display = "none";

  await load();
}
</script>

</body>
</html>
