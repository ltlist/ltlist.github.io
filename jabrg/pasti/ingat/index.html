<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Jabrig Admin</title>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<link rel="stylesheet" href="style.css">
</head>

<body>
    
<!-- LOGIN -->
<div id="loginBox">

<h2>Login Admin</h2>

<input type="email" id="email" placeholder="Email">
<br><br>

<input type="password" id="pass" placeholder="Password">
<br><br>

<button onclick="login()">Login</button>

<p id="msg"></p>

</div>
<!-- DASHBOARD -->
<div id="dashboard" style="display:none;">

<h2>Jabrig Admin Panel</h2>

<p id="userInfo"></p>
<a href="https://ltlist.github.io/faucetlist" target="_blank">
  <button class="btn-link">🌐 Open Website</button>
</a>
<div class="form-box">
  <input id="name" placeholder="Name">

  <select id="coin">
    <option value="LTC">LTC</option>
    <option value="ZER">ZER</option>
    <option value="DOGE">DOGE</option>
    <option value="USDT">USDT</option>
    <option value="MULTI">MULTI</option>
  </select>

  <input id="link" placeholder="Link">
  <input id="cooldown" placeholder="Cooldown">

  <button class="btn" onclick="addData()">➕ Add</button>
  <button onclick="logout()">Logout</button>
</div>
<!-- EDIT -->
<div id="editBox">
  <h3>Edit Data</h3>

  <input id="eid" placeholder="ID">
  <input id="ename" placeholder="Name">

  <select id="ecoin">
    <option value="LTC">LTC</option>
    <option value="ZER">ZER</option>
    <option value="DOGE">DOGE</option>
    <option value="USDT">USDT</option>
    <option value="MULTI">MULTI</option>
  </select>

  <input id="elink" placeholder="Link">
  <input id="ecooldown" placeholder="Cooldown">

  <button class="btn" onclick="updateData()">💾 Save</button>
</div>

<div class="table-container">
  <table id="table"></table>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
