name: Update Faucet List

on:
  workflow_dispatch: # Pencet manual buat ngetes
  # schedule:
  # - cron: '0 */6 *' # Aktifin ini kalau udah jalan. = tiap 6 jam

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Izin buat push cards.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }} # Wajib pake PAT biar bisa push

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Fetch & Buat cards.json
        env:
          REFLINK_ID: 5725 # <-- GANTI INI PAKE ID REF KAMU
        run: |
          python3 << 'EOF'
          import requests, json, os, sys

          REF_ID = os.getenv('REFLINK_ID')
          URL = "https://faucetpay.io/api/listv1/faucetlist"
          KOIN_TARGET = ['DOGE', 'LTC', 'TRX', 'SOL', 'USDT', 'USDC', 'BCH']
          
          # 1. Kasih headers biar gak di-block 403
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 ltlist-bot/1.0"
          }
          
          try:
              r = requests.get(URL, headers=headers, timeout=20)
              r.raise_for_status() # Auto stop kalau 403/500
          except requests.exceptions.HTTPError as e:
              print(f"GAGAL FETCH API: {e}")
              print(f"Response: {r.text[:500]}")
              sys.exit(1) # Biar Actions merah + keliatan errornya
          
          data = r.json()

          # 2. Safety check biar gak KeyError
          if 'list_data' not in data or 'normal' not in data['list_data']:
              print("ERROR: Struktur JSON FaucetPay berubah!")
              print("Isi JSON:", json.dumps(data, indent=2)[:1000])
              sys.exit(1)

          output = []
          rank = 1
          for coin in KOIN_TARGET:
              for f in data['list_data']['normal'].get(coin, []):
                  try:
                      if f.get('is_enabled') == '1' and float(f.get('reward', 0)) > 0:
                          url_asli = f.get('url', '#')
                          sep = '&' if '?' in url_asli else '?'
                          output.append({
                              "id": f.get('name', 'no-name').lower().replace(' ', '-'),
                              "name": f.get('name'), 
                              "coin": coin,
                              "url": f"{url_asli}{sep}ref={REF_ID}",
                              "status": "active", 
                              "rank": rank,
                              "uptime": int(f.get('health', 100)), 
                              "clicks": 0
                          })
                          rank += 1
                  except Exception as e:
                      print(f"Skip faucet error: {f.get('name')} -> {e}")

          with open('cards.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, indent=2, ensure_ascii=False)
          print(f"Selesai. Total faucet: {len(output)}")
          EOF

      - name: Fetch & Buat cards.json
  run: |
    python3 << 'EOF'
    import requests, json

    URL = "https://faucetpay.io/api/listv1/faucetlist"
    headers = {
        "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 ltlist-bot/1.0"
    }
    
    r = requests.get(URL, headers=headers, timeout=20)
    
    print("=== STATUS CODE ===")
    print(r.status_code) # 200 = ok, 403 = di-block
    
    print("=== ISI 1000 KARAKTER PERTAMA ===")
    print(r.text[:1000]) # Ini kuncinya. Kita liat FaucetPay ngasih apa
    
    EOF