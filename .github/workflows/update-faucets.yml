name: Update Faucet List

on:
  workflow_dispatch: # Ini biar bisa kita pencet manual buat tes

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Fetch & Buat cards.json
        env:
          REFLINK_ID: 5725 # <-- GANTI INI AJA DULU
        run: |
          python3 << 'EOF'
          import requests, json, os

          REF_ID = os.getenv('REFLINK_ID')
          URL = "https://faucetpay.io/api/listv1/faucetlist"
          KOIN_TARGET = ['DOGE', 'LTC', 'TRX', 'SOL', 'USDT', 'USDC', 'BCH']

          r = requests.get(URL)
          data = r.json()

          output = []
          rank = 1
          for coin in KOIN_TARGET:
              for f in data['list_data']['normal'].get(coin, []):
                  if f['is_enabled'] == '1' and float(f['reward']) > 0:
                      url_asli = f['url']
                      sep = '&' if '?' in url_asli else '?'
                      output.append({
                          "id": f['name'].lower().replace(' ', '-'),
                          "name": f['name'], "coin": coin,
                          "url": f"{url_asli}{sep}ref={REF_ID}",
                          "status": "active", "rank": rank,
                          "uptime": int(f['health']), "clicks": 0
                      })
                      rank += 1

          with open('cards.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, indent=2, ensure_ascii=False)
          print(f"Selesai. Total faucet: {len(output)}")
          EOF

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add cards.json
          git commit -m "chore: update faucet list [bot]" || exit 0
          git push