name: Update Faucet List

on:
  schedule:
    - cron: "0 */6 * *" # tiap 6 jam
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # <-- Ini wajib biar bisa push

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # <-- Pake token bawaan GitHub

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run script
        run: node update.js

      - name: Commit & Push
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add cards.json
          git diff --staged --quiet || (
            git commit -m "Update faucet list [bot]"
            git push
          )