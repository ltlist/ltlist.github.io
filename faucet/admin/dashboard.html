<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--muted:#94a3b8;--green:#22c55e;--red:#ef4444;--yellow:#facc15;--blue:#3b82f6}
body{margin:0;font-family:sans-serif;background:var(--bg);color:#e2e8f0}
.navbar{padding:12px 16px;background:var(--card);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.tabs{display:flex;gap:8px;padding:12px;background:var(--bg);overflow-x:auto}
.tab-btn{padding:8px 14px;border:0;border-radius:8px;background:var(--card);color:var(--muted);cursor:pointer}
.tab-btn.active{background:var(--blue);color:#fff}
.container{padding:16px}
.card{background:var(--card);padding:12px;border-radius:12px;margin-bottom:10px;display:grid;gap:8px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat-card{background:var(--card);padding:16px;border-radius:12px;text-align:center}
.stat-card h3{margin:0;font-size:14px;color:var(--muted)}
.stat-card p{margin:4px 0 0;font-size:22px;font-weight:bold}
input,select,button{padding:8px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0}
.btn-red{background:var(--red);border:0;cursor:pointer}
.btn-green{background:var(--green);border:0;cursor:pointer}
.btn-blue{background:var(--blue);border:0;cursor:pointer}
.hidden{display:none}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;text-align:left;border-bottom:1px solid #334155}
</style>
</head>
<body>
<div class="navbar"><h2>Admin Panel</h2><button class="btn-red" onclick="logout()">Logout</button></div>
<div id="status" style="padding:8px 16px;color:var(--yellow)">Coin aktif memeriksa...</div>

<div class="tabs hidden" id="tabs">
  <button class="tab-btn active" onclick="showTab('faucets')">Faucets</button>
  <button class="tab-btn" onclick="showTab('users')">Users</button>
  <button class="tab-btn" onclick="showTab('claims')">Claims</button>
  <button class="tab-btn" onclick="showTab('withdraw')">Withdraw</button>
</div>

<div class="container hidden" id="main">

  <!-- STAT CARD -->
  <div class="grid-4">
    <div class="stat-card"><h3>Total Users</h3><p id="totalUsers">0</p></div>
    <div class="stat-card"><h3>Total Claims</h3><p id="totalClaims">0</p></div>
    <div class="stat-card"><h3>WD Pending</h3><p id="wdPending">0</p></div>
    <div class="stat-card"><h3>Saldo Keluar</h3><p id="saldoKeluar">0</p></div>
  </div>

  <!-- TAB 1: FAUCETS -->
  <div id="tab-faucets">
    <h3>Tambah Faucet</h3>
    <input id="name" placeholder="Nama Faucet"><input id="url" placeholder="URL"><input id="coin" placeholder="COIN">
    <button class="btn-green" onclick="addFaucet()">Tambah</button>
    <div id="listFaucet" style="margin-top:16px"></div>
  </div>

  <!-- TAB 2: USERS -->
  <div id="tab-users" class="hidden">
    <h3>Data User</h3>
    <table><thead><tr><th>Email</th><th>UID</th><th>Saldo</th><th>Coin</th></tr></thead><tbody id="listUsers"></tbody></table>
  </div>

  <!-- TAB 3: CLAIMS -->
  <div id="tab-claims" class="hidden">
    <h3>Log Claim</h3>
    <table><thead><tr><th>Email</th><th>Faucet</th><th>Dapet</th><th>Waktu</th></tr></thead><tbody id="listClaims"></tbody></table>
  </div>

  <!-- TAB 4: WITHDRAW -->
  <div id="tab-withdraw" class="hidden">
    <h3>Request WD</h3>
    <table><thead><tr><th>Email</th><th>Jumlah</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="listWD"></tbody></table>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, updateDoc, query, orderBy, increment, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"; 

const UID_ADMIN = "gZPXqeKPBAZfCzYXEcrGWMcSFHI2"; 
const app = initializeApp({apiKey:"AIzaSyAVokWj_l3aITEhj6UPetF-MGQXKdv75S8",authDomain:"ltlist-f.firebaseapp.com",projectId:"ltlist-f"});
const db = getFirestore(app); const auth = getAuth(app);

const requireAdmin = () => auth.currentUser?.uid === UID_ADMIN;

function showTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`[onclick="showTab('${tab}')"]`).classList.add('active');
  document.querySelectorAll('[id^=tab-]').forEach(d=>d.classList.add('hidden'));
  document.getElementById(`tab-${tab}`).classList.remove('hidden');
  if(tab==='users') loadUsers(); if(tab==='claims') loadClaims(); if(tab==='withdraw') loadWD();
}

async function loadAll(){
  if(!requireAdmin()) return;
  document.getElementById('status').classList.add('hidden');
  document.getElementById('tabs').classList.remove('hidden');
  document.getElementById('main').classList.remove('hidden');
  const [u,c,w,f] = await Promise.all([getDocs('users'),getDocs('claims'),getDocs('withdrawals'),getDocs(query(collection(db,'faucets'),orderBy('rank')))]);
  document.getElementById('totalUsers').textContent=u.size;
  document.getElementById('totalClaims').textContent=c.size;
  document.getElementById('wdPending').textContent=(await getDocs(query(collection(db,'withdrawals'),where('status','==','pending')))).size;
  let total=0; c.forEach(d=>total+=d.data().amount||0); document.getElementById('saldoKeluar').textContent=total;
  renderFaucets(f.docs.map(d=>({id:d.id,...d.data()})));
}

function renderFaucets(data){
  const div=document.getElementById('listFaucet');
  if(!data.length) return div.innerHTML='<p>Belum ada faucet</p>';
  div.innerHTML=data.map(d=>`<div class="card"><b>#${d.rank} ${d.name} | ${d.coin}</b><br>${d.clicks||0} claims | ${d.status}<br><button onclick="deleteFaucet('${d.id}')">Hapus</button></div>`).join('');
}

window.addFaucet=async()=>{ if(!requireAdmin())return; const name=name.value.trim(),url=url.value.trim(),coin=coin.value.trim().toUpperCase(); if(!name||!url||!coin)return alert('Lengkapin'); const snap=await getDocs(collection(db,'faucets')); await addDoc(collection(db,'faucets'),{name,url,coin,status:'active',rank:snap.size+1,uptime:100,clicks:0}); name.value='';url.value='';coin.value=''; loadAll(); }
window.deleteFaucet=async(id)=>{ if(!requireAdmin()||!confirm('Hapus?'))return; await deleteDoc(doc(db,'faucets',id)); loadAll(); }

async function loadUsers(){ const snap=await getDocs('users'); listUsers.innerHTML=snap.docs.map(d=>`<tr><td>${d.data().email}</td><td>${d.id.slice(0,6)}...</td><td>${d.data().balance||0}</td><td>${d.data().coin||'-'}</td></tr>`).join(''); }
async function loadClaims(){ const snap=await getDocs(query(collection(db,'claims'),orderBy('time','desc'))); listClaims.innerHTML=snap.docs.map(d=>`<tr><td>${d.data().email}</td><td>${d.data().faucet}</td><td>${d.data().amount}</td><td>${new Date(d.data().time?.seconds*1000).toLocaleString('id')}</td></tr>`).join(''); }
async function loadWD(){ const snap=await getDocs(query(collection(db,'withdrawals'),where('status','==','pending'))); listWD.innerHTML=snap.docs.map(d=>`<tr><td>${d.data().email}</td><td>${d.data().amount}</td><td>${d.data().status}</td><td><button class="btn-green" onclick="approveWD('${d.id}',${d.data().amount},'${d.data().uid}')">Approve</button></td></tr>`).join(''); }
window.approveWD=async(id,amount,uid)=>{ if(!requireAdmin())return; await updateDoc(doc(db,'withdrawals',id),{status:'paid'}); const u=await getDocs(query(collection(db,'users'),where('__name__','==',uid))); if(!u.empty) await updateDoc(doc(db,'users',uid),{balance:increment(-amount)}); loadAll(); }

window.logout=()=>signOut(auth).then(()=>location.href='login.html');
onAuthStateChanged(auth,u=>{ if(!u||u.uid!==UID_ADMIN){if(u)signOut(auth);location.href='login.html';}else loadAll(); });
</script>
</body>
</html>
