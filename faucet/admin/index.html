<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | LTC Faucet</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<main class="auth-wrap">
  <div class="card container auth-card">
    <h2>Admin Login</h2>
    <form id="loginForm" autocomplete="on">
      <input id="email" type="email" placeholder="Email Admin" autocomplete="email" required>
      <input id="pass" type="password" placeholder="Password" autocomplete="current-password" required>
      <button id="btnLogin" type="submit">Login</button>
      <p id="err" class="error-text"></p>
    </form>
    <a href="../" class="link-back">← Kembali ke Faucet</a>
  </div>
</main>
<script type="module" src="admin.js"></script>
</body>
</html>
