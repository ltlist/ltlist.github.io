<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LT Faucet PRO</title>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff}
.container{max-width:520px;margin:30px auto;padding:15px}
.card{background:#111827;padding:18px;border-radius:12px;margin-bottom:12px}
input,button{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:none}
button{background:#22c55e;font-weight:bold;cursor:pointer}
.animalBox{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.animal{background:#1e293b;padding:12px;border-radius:10px;text-align:center;cursor:pointer}
.animal.active{background:#22c55e;color:#000}
</style>
</head>

<body>
<div class="container">

<div class="card">
<h2>🚀 LT Faucet PRO</h2>
</div>

<div class="card">
<input id="email" placeholder="Email">
<input id="username" placeholder="FaucetPay Username">

<div class="cf-turnstile" data-sitekey="0x4AAAAAADk00FmP5a2Feee3"></div>

<button onclick="getChallenge()">GET CHALLENGE</button>

<div id="q"></div>
<input id="math" placeholder="Jawaban angka">

<div class="animalBox" id="animals"></div>

<button onclick="claim()">CLAIM</button>

<div id="res"></div>
</div>

</div>

<script>
const API = "https://calm-art-584f.cnamelist.workers.dev";

let sessionId = "";
let selected = "";

const icons = {
 cat:"🐱", dog:"🐶", rabbit:"🐰", cow:"🐮", lion:"🦁"
};

async function getChallenge(){
 const r = await fetch(API+"/api/challenge");
 const d = await r.json();

 sessionId = d.sessionId;
 selected = "";

 document.getElementById("q").innerHTML = "Soal: " + d.question;

 document.getElementById("animals").innerHTML =
 d.animals.map(a =>
 `<div class="animal" onclick="pick('${a}',this)">
 ${icons[a]} ${a}
 </div>`
 ).join("");
}

function pick(a,el){
 selected = a;
 document.querySelectorAll(".animal").forEach(e=>e.classList.remove("active"));
 el.classList.add("active");
}

async function claim(){
 const email = document.getElementById("email").value;
 const username = document.getElementById("username").value;
 const math = document.getElementById("math").value;
 const token = turnstile.getResponse();

 const r = await fetch(API+"/api/claim",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({
    email, username, token,
    sessionId,
    mathAnswer: math,
    animalAnswer: selected
  })
 });

 const d = await r.json();
 document.getElementById("res").innerHTML =
 d.success ? "✅ " + d.message : "❌ " + d.error;
}
</script>

</body>
</html>
