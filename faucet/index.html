<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LT Faucet PRO</title>

<!-- Turnstile -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:#fff;
}

.container{
  max-width:520px;
  margin:30px auto;
  padding:15px;
}

.card{
  background:#111827;
  padding:18px;
  border-radius:12px;
  margin-bottom:12px;
}

input,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:none;
  font-size:15px;
}

button{
  background:#22c55e;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:0.5;
}

.small{
  font-size:13px;
  color:#94a3b8;
  margin-top:6px;
}

#animalBox{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:10px;
}

.animal{
  background:#1e293b;
  border:2px solid #334155;
  padding:14px;
  border-radius:12px;
  text-align:center;
  cursor:pointer;
  font-size:22px;
  transition:0.2s;
}

.animal.active{
  border-color:#22c55e;
  background:#22c55e;
  color:#000;
}

#result{
  margin-top:10px;
  min-height:20px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

  <div class="card">
    <h2>🚀 LT Faucet PRO</h2>
    <div class="small">
      60 menit / claim • max 7/hari • anti bot system
    </div>
  </div>

  <div class="card">

    <!-- USER -->
    <input id="username" placeholder="FaucetPay Username">

    <!-- CAPTCHA (ONLY ONCE) -->
    <div class="cf-turnstile"
      data-sitekey="0x4AAAAAADk00FmP5a2Feee3"></div>

    <!-- CHALLENGE -->
    <button onclick="getChallenge()">1. GET CHALLENGE</button>

    <div id="question" class="small"></div>

    <input id="mathAnswer" type="number" placeholder="Jawaban angka">

    <div id="animalBox"></div>

    <button id="claimBtn" onclick="claim()">2. CLAIM</button>

    <div id="result"></div>

  </div>

  <div class="card">
    <h3>📜 Latest Claims</h3>
    <div id="history" class="small">Loading...</div>
  </div>

</div>

<script>

const API = "https://calm-art-584f.cnamelist.workers.dev";

const animalIcons = {
  cat:"🐱",
  dog:"🐶",
  rabbit:"🐰",
  cow:"🐮",
  lion:"🦁"
};

let sessionId = "";
let selectedAnimal = "";

function log(t){
  document.getElementById("result").innerHTML = t;
}

/* =========================
   GET CHALLENGE
========================= */
async function getChallenge(){
  try{
    const res = await fetch(API + "/api/challenge");
    const data = await res.json();

    sessionId = data.sessionId;
    selectedAnimal = "";

    document.getElementById("question").innerHTML =
      "Solve: <b>" + data.question + "</b>";

    const box = document.getElementById("animalBox");
    box.innerHTML = "";

    data.animals.forEach(a => {

      const div = document.createElement("div");
      div.className = "animal";

      div.innerHTML = animalIcons[a] + "<br>" + a;

      div.onclick = () => {

        document.querySelectorAll(".animal").forEach(b=>{
          b.classList.remove("active");
        });

        div.classList.add("active");
        selectedAnimal = a;
      };

      box.appendChild(div);
    });

  }catch(e){
    log("❌ Gagal load challenge");
  }
}

/* =========================
   CLAIM
========================= */
async function claim(){

  const username = document.getElementById("username").value.trim();
  const token = turnstile.getResponse();
  const mathAnswer = document.getElementById("mathAnswer").value;

  if(!username || !token || !mathAnswer || !selectedAnimal){
    log("❌ Lengkapi semua data");
    return;
  }

  document.getElementById("claimBtn").disabled = true;
  log("⏳ Processing...");

  try{

    const res = await fetch(API + "/api/claim", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        username,
        token,
        sessionId,
        mathAnswer,
        animalAnswer: selectedAnimal
      })
    });

    const data = await res.json();

    log(
      data.success
        ? "✅ " + data.message + " | Sisa: " + data.remaining
        : "❌ " + data.error
    );

    // reset state
    selectedAnimal = "";
    document.querySelectorAll(".animal").forEach(b=>{
      b.classList.remove("active");
    });

    turnstile.reset();
    getChallenge();

  }catch(e){
    log("❌ Server error");
  }

  document.getElementById("claimBtn").disabled = false;
  loadHistory();
}

/* =========================
   HISTORY
========================= */
async function loadHistory(){

  try{
    const res = await fetch(API + "/api/history");
    const data = await res.json();

    document.getElementById("history").innerHTML =
      data.length
        ? data.map(h =>
          `${h.user} | ${h.amount} | ${new Date(h.time).toLocaleTimeString()}`
        ).join("<br>")
        : "Belum ada claim";

  }catch(e){
    document.getElementById("history").innerHTML =
      "Gagal load history";
  }
}

getChallenge();
loadHistory();

</script>

</body>
</html>
