<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LT Faucet PRO</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0f172a;
  color:#e2e8f0;
  display:flex;
  justify-content:center;
}

.container{
  width:100%;
  max-width:500px;
  padding:20px;
}

h1{
  color:#5eead4;
  text-align:center;
}

.card{
  background:#111827;
  padding:15px;
  border-radius:10px;
  margin-top:15px;
}

input, button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:none;
  font-size:14px;
}

input{
  background:#0b1220;
  color:#fff;
}

button{
  background:#22c55e;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  background:#16a34a;
}

.small{
  font-size:13px;
  color:#94a3b8;
}

.row{
  display:flex;
  gap:10px;
}

.row div{
  flex:1;
}

#animalBox{
  font-size:40px;
  text-align:center;
  margin:10px 0;
}

.history{
  font-size:13px;
  margin-top:10px;
}

.bad{
  color:#f87171;
}

.good{
  color:#4ade80;
}
</style>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>

<body>
<div class="container">

<h1>⚡ LT Faucet PRO</h1>

<div class="card">
  <div class="small">Reward: 0.00000160 LTC</div>
  <div class="small" id="stats">Loading stats...</div>
</div>

<div class="card">

  <div id="animalBox">❓</div>
  <div id="question" class="small">Loading challenge...</div>

  <div class="row">
    <div>
      <input id="mathAnswer" placeholder="Jawaban matematika">
    </div>
    <div>
      <input id="animalAnswer" placeholder="hewan (cat/dog/dll)">
    </div>
  </div>

  <input id="username" placeholder="FaucetPay Username">

  <!-- TURNSTILE -->
  <div style="margin-top:10px"
       class="cf-turnstile"
       data-sitekey="0x4AAAAAADk00FmP5a2Feee3"></div>

  <button onclick="claim()">CLAIM</button>

  <div id="msg" class="small"></div>
</div>

<div class="card">
  <b>History</b>
  <div id="history" class="history">Loading...</div>
</div>

</div>

<script>
const API = "";

let sessionId = "";

async function loadChallenge(){
  const res = await fetch(API + "/api/challenge");
  const data = await res.json();

  sessionId = data.sessionId;

  document.getElementById("question").innerText =
    "Berapa hasil: " + data.question;

  document.getElementById("animalBox").innerText = "🐾";
}

async function loadStats(){
  const res = await fetch(API + "/api/stats");
  const data = await res.json();
  document.getElementById("stats").innerText =
    "Total claim: " + data.claims;
}

async function loadHistory(){
  const res = await fetch(API + "/api/history");
  const data = await res.json();

  let html = "";
  data.forEach(h=>{
    html += `
      <div>👤 ${h.user} | ${h.amount} | ${new Date(h.time).toLocaleString()}</div>
    `;
  });

  document.getElementById("history").innerHTML = html || "Belum ada data";
}

async function claim(){

  const username = document.getElementById("username").value;
  const mathAnswer = document.getElementById("mathAnswer").value;
  const animalAnswer = document.getElementById("animalAnswer").value;
  const token = document.querySelector('[name="cf-turnstile-response"]').value;

  document.getElementById("msg").innerText = "Processing...";

  const res = await fetch(API + "/api/claim", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      username,
      sessionId,
      mathAnswer,
      animalAnswer,
      token
    })
  });

  const data = await res.json();

  if(data.success){
    document.getElementById("msg").innerHTML =
      "<span class='good'>" + data.message + "</span>";

    loadStats();
    loadHistory();
    loadChallenge();
  }else{
    document.getElementById("msg").innerHTML =
      "<span class='bad'>" + data.error + "</span>";
  }
}

loadChallenge();
loadStats();
loadHistory();
</script>

</body>
</html>
