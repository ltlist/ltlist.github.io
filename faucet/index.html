<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LT Faucet</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
body{margin:0;font-family:Arial;background:#0f172a;color:#fff}
.container{max-width:500px;margin:40px auto;padding:20px}
.card{background:#111827;padding:20px;border-radius:12px;margin-bottom:15px}
input,button{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:none;font-size:16px}
button{background:#22c55e;color:#000;font-weight:bold;cursor:pointer}
button:disabled{opacity:0.5;cursor:not-allowed}
.small{font-size:13px;color:#94a3b8}
#animalBtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.animalBtn{
  flex:1 1 30%; 
  background:#1e293b; 
  border:2px solid #334155;
  border-radius:12px;
  padding:12px 4px;
  text-align:center;
  cursor:pointer;
  transition:0.2s;
}
.animalBtn img{font-size:28px;display:block;margin:0 auto 4px} /* Emoji dibesarin */
.animalBtn span{font-size:13px;font-weight:600;text-transform:capitalize}
.animalBtn.active{
  background:#22c55e;
  border-color:#22c55e;
  transform:scale(1.05);
}
#result{margin-top:10px;min-height:20px;font-weight:600}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h2>🚀 LT Faucet</h2>
    <div class="small">Reward: 0.00000160 LTC / 60 Menit | Max 7/hari</div>
  </div>
  <div class="card">
    <input id="username" placeholder="FaucetPay Username / Email">
    <div class="cf-turnstile" data-sitekey="ISI_SITE_KEY_KAMU"></div>
    
    <div id="challengeBox" class="small" style="margin-top:12px;display:none">
      Soal: <b id="qText"></b><br>Pilih Hewan:
    </div>
    <input id="mathAnswer" type="number" inputmode="numeric" placeholder="Jawaban angka" style="display:none">
    <div id="animalBtns"></div>

    <button id="claimBtn" onclick="claim()">2. CLAIM</button>
    <div id="result" class="small"></div>
  </div>
  <div class="card">
    <h3>📜 Latest Claims</h3>
    <div id="history" class="small">Loading...</div>
  </div>
</div>
<script>
const API = "https://calm-art-584f.cnamelist.workers.dev";

// Map nama -> emoji
const animalIcons = { cat: "🐱", dog: "🐶", rabbit: "🐰", cow: "🐄", lion: "🦁" };

let sessionId = "";
let pickedAnimal = "";
const log = (t) => { document.getElementById("result").innerHTML = t; };

async function getChallenge(){
  try{
    const res = await fetch(API + "/api/challenge");
    const data = await res.json();
    sessionId = data.sessionId;
    document.getElementById("qText").innerText = data.question;
    document.getElementById("challengeBox").style.display = 'block';
    document.getElementById("mathAnswer").style.display = 'block';
    
    // Bikin tombol emoji
    document.getElementById("animalBtns").innerHTML = data.animals.map(a=>`
      <div class="animalBtn" onclick="pick('${a}', this)">
        <img>${animalIcons[a] || '❓'}</img>
        <span>${a}</span>
      </div>
    `).join('');
    pickedAnimal = "";
  }catch(e){ log('❌ Gagal load challenge'); }
}

function pick(a, el){
  pickedAnimal = a;
  document.querySelectorAll('.animalBtn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
}

async function claim(){
  const username = document.getElementById("username").value.trim();
  const token = turnstile.getResponse();
  const mathAnswer = document.getElementById("mathAnswer").value;
  if(!username||!token||!mathAnswer||!pickedAnimal){ alert('Isi semua + pilih hewan'); return; }
  
  document.getElementById("claimBtn").disabled = true;
  log('⏳ Memproses...');

  try{
    const res = await fetch(API + "/api/claim", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, token, sessionId, mathAnswer, animalAnswer: pickedAnimal })
    });
    const data = await res.json();
    log(data.success ? `✅ ${data.message} Sisa: ${data.remaining}/7` : `❌ ${data.error}`);
  }catch(e){ log('❌ Koneksi ke Worker gagal'); }
  
  turnstile.reset();
  getChallenge();
  document.getElementById("claimBtn").disabled = false;
}

async function loadHistory(){
  try{
    const res = await fetch(API + "/api/history");
    const data = await res.json();
    document.getElementById("history").innerHTML = data.length ? data.map(h => `${h.user} | ${h.amount} | ${new Date(h.time).toLocaleTimeString()}`).join("<br>") : 'Belum ada claim';
  }catch(e){ document.getElementById("history").innerHTML = 'Gagal load'; }
}

getChallenge();
loadHistory();
</script>
</body>
</html>
