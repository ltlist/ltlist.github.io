<!DOCTYPE html>
<html>
<head><title>LT Faucet</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>body{font-family:sans-serif;max-width:400px;margin:50px auto;text-align:center}input,button{width:100%;padding:10px;margin:5px 0}</style>
</head>
<body>
<h2>LT Faucet V3.3</h2>
<input id="wallet" placeholder="FaucetPay Email">
<div class="cf-turnstile" data-sitekey="0x4AAAAAAA_SITEKEY_KAMU"></div>
<button onclick="claim()">Claim</button>
<button onclick="payout()">Withdraw</button>
<p id="msg"></p>
<p id="stats"></p>

<script>
const API_URL = "https://lt-faucet.YOURNAME.workers.dev"; // GANTI INI

async function api(path, body){
  const res = await fetch(API_URL+path, {method: body?"POST":"GET", headers:{"Content-Type":"application/json"}, body: body?JSON.stringify(body):null});
  return res.json();
}

async function claim(){
  const wallet = document.getElementById('wallet').value;
  const token = document.querySelector('.cf-turnstile input').value;
  const urlParams = new URLSearchParams(window.location.search);
  const ref = urlParams.get('ref'); //?ref=wallet_pengundang
  const data = await api('/claim', {wallet, turnstileToken: token, ref});
  document.getElementById('msg').innerText = JSON.stringify(data);
  loadStats();
}

async function payout(){
  const wallet = document.getElementById('wallet').value;
  const data = await api('/payout', {wallet, currency: "DOGE"});
  document.getElementById('msg').innerText = JSON.stringify(data);
}

async function loadStats(){
  const s = await api('/stats');
  document.getElementById('stats').innerText = `Reward: ${s.reward} | Daily: ${s.dailyLimit}x | Min WD: ${s.minPayout}`;
}
loadStats();
</script>
</body>
</html>
