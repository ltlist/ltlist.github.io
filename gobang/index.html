<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Kelola Faucet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#165DFF',
            dark: '#1D2129',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto { content-visibility: auto; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
    }
  </style>
</head>
<body class="bg-gray-50 font-sans text-dark min-h-screen">

  <!-- HEADER KHUSUS ADMIN -->
  <header class="bg-red-600 text-white shadow-md">
    <div class="container mx-auto px-4 py-6">
      <h1 class="text-[clamp(1.5rem,3vw,2.5rem)] font-bold text-center">
        <i class="fa fa-cog mr-2"></i> ADMIN PANEL
      </h1>
      <p class="text-center text-white/80 mt-1">Kelola Data - <a href="https://ltlist.github.io/" target="_blank" class="underline">Lihat Tampilan Situs</a></p>
    </div>
  </header>

  <!-- ==================================================
       MODAL LOGIN ADMIN
       ================================================== -->
  <div id="modalLogin" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-lg shadow-2xl w-full max-w-md p-6 transform transition-all">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">🔐 Masuk Admin</h2>
        <p class="text-gray-500 text-sm">Hanya untuk pengelola</p>
      </div>
      <div class="mb-4">
        <label class="block text-gray-700 text-sm mb-1">Username</label>
        <input type="text" id="userAdmin" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary" value="admin">
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 text-sm mb-1">Password</label>
        <input type="password" id="passAdmin" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary" value="123456">
      </div>
      <button onclick="loginAdmin()" class="w-full bg-primary text-white py-2.5 rounded-lg hover:bg-primary/90 transition font-medium">
        Masuk
      </button>
    </div>
  </div>

  <!-- ==================================================
       PANEL KELOLA DATA
       ================================================== -->
  <div id="panelKelola" class="hidden container mx-auto px-4 py-8">
    <div class="bg-white rounded-xl shadow p-6 mb-6">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-xl font-bold text-gray-800">⚙️ Daftar Data Faucet</h3>
        <div>
          <button onclick="bukaModalTambah()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition text-sm mr-2">
            <i class="fa fa-plus"></i> Tambah Baru
          </button>
          <button onclick="keluarAdmin()" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition text-sm">
            <i class="fa fa-sign-out"></i> Keluar
          </button>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-100">
            <tr>
              <th class="p-2 text-left">ID</th>
              <th class="p-2 text-left">Nama</th>
              <th class="p-2 text-left">Koin</th>
              <th class="p-2 text-left">Cooldown</th>
              <th class="p-2 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="tabelKelola"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- MODAL FORM TAMBAH/EDIT -->
  <div id="modalForm" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6">
      <h4 id="judulForm" class="text-lg font-bold mb-4">Form Data</h4>
      <input type="hidden" id="indexBaris">
      <div class="mb-3">
        <label class="text-sm text-gray-600">ID</label>
        <input type="text" id="f_id" class="w-full border px-3 py-2 rounded">
      </div>
      <div class="mb-3">
        <label class="text-sm text-gray-600">Nama Faucet</label>
        <input type="text" id="f_name" class="w-full border px-3 py-2 rounded">
      </div>
      <div class="mb-3">
        <label class="text-sm text-gray-600">Jenis Koin</label>
        <input type="text" id="f_coin" class="w-full border px-3 py-2 rounded">
      </div>
      <div class="mb-3">
        <label class="text-sm text-gray-600">Link URL</label>
        <input type="url" id="f_link" class="w-full border px-3 py-2 rounded">
      </div>
      <div class="mb-4">
        <label class="text-sm text-gray-600">Cooldown (menit)</label>
        <input type="number" id="f_cooldown" class="w-full border px-3 py-2 rounded">
      </div>
      <div class="flex gap-2">
        <button onclick="simpanData()" class="bg-primary text-white px-4 py-2 rounded hover:bg-primary/90">Simpan</button>
        <button onclick="tutupModal('modalForm')" class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400">Batal</button>
      </div>
    </div>
  </div>

  <script>
    // ==================================================
    // 🔐 PENGATURAN LOGIN
    // ==================================================
    const ADMIN_USER = "admin";
    const ADMIN_PASS = "123456";
    let daftarFaucet = [];

    // Simpan data ke Penyimpanan Browser (Bisa dibaca oleh halaman utama)
    function simpanKeStorage() {
      localStorage.setItem("dataFaucet", JSON.stringify(daftarFaucet));
    }

    // Ambil data saat halaman dibuka
    window.onload = () => {
      const simpanan = localStorage.getItem("dataFaucet");
      if (simpanan) daftarFaucet = JSON.parse(simpanan);
      
      if (localStorage.getItem("adminLogin") === "ok") {
        document.getElementById('modalLogin').classList.add('hidden');
        document.getElementById('panelKelola').classList.remove('hidden');
        muatDataKelola();
      }
    };

    // ==================================================
    // BAGIAN LOGIN
    // ==================================================
    function loginAdmin() {
      const user = document.getElementById('userAdmin').value;
      const pass = document.getElementById('passAdmin').value;
      
      if (user === ADMIN_USER && pass === ADMIN_PASS) {
        localStorage.setItem("adminLogin", "ok");
        document.getElementById('modalLogin').classList.add('hidden');
        document.getElementById('panelKelola').classList.remove('hidden');
        muatDataKelola();
      } else {
        alert("Login gagal! Cek username/password.");
      }
    }

    function tutupModal(id) { document.getElementById(id).classList.add('hidden'); }

    // Tampilkan data di panel admin
    function muatDataKelola() {
      const tbody = document.getElementById('tabelKelola');
      tbody.innerHTML = "";

      daftarFaucet.forEach((item, i) => {
        const tr = document.createElement('tr');
        tr.className = "border-b hover:bg-gray-50";
        tr.innerHTML = `
          <td class="p-2">${item[0]}</td>
          <td class="p-2">${item[1]}</td>
          <td class="p-2">${item[2]}</td>
          <td class="p-2">${item[4]} mnt</td>
          <td class="p-2 text-center">
            <button onclick="bukaEdit(${i})" class="text-yellow-600 mr-2" title="Edit"><i class="fa fa-pencil"></i></button>
            <button onclick="hapusData(${i})" class="text-red-600" title="Hapus"><i class="fa fa-trash"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Tambah & Edit
    function bukaModalTambah() {
      document.getElementById('judulForm').innerText = "Tambah Faucet Baru";
      document.getElementById('indexBaris').value = "";
      bersihkanForm();
      document.getElementById('modalForm').classList.remove('hidden');
    }
    function bukaEdit(i) {
      document.getElementById('judulForm').innerText = "Ubah Data Faucet";
      document.getElementById('indexBaris').value = i;
      const item = daftarFaucet[i];
      document.getElementById('f_id').value = item[0];
      document.getElementById('f_name').value = item[1];
      document.getElementById('f_coin').value = item[2];
      document.getElementById('f_link').value = item[3];
      document.getElementById('f_cooldown').value = item[4];
      document.getElementById('modalForm').classList.remove('hidden');
    }

    function simpanData() {
      const baris = document.getElementById('indexBaris').value;
      const dataBaru = [
        document.getElementById('f_id').value,
        document.getElementById('f_name').value,
        document.getElementById('f_coin').value,
        document.getElementById('f_link').value,
        parseInt(document.getElementById('f_cooldown').value)
      ];

      if (baris === "") {
        daftarFaucet.push(dataBaru); // Tambah baru
      } else {
        daftarFaucet[parseInt(baris)] = dataBaru; // Ubah yang ada
      }

      simpanKeStorage(); // Simpan perubahan
      tutupModal('dataModal'); 
      muatDataKelola();
      alert("Data disimpan! Cek di halaman utama.");
    }

    function hapusData(i) {
      if(confirm("Yakin ingin menghapus data ini?")) {
        daftarFaucet.splice(i, 1); // Hapus array
        simpanKeStorage();
        muatDataKelola();
      }
    }

    function bersihkanForm() {
      document.getElementById('f_id').value = "";
      document.getElementById('f_name').value = "";
      document.getElementById('f_coin').value = "";
      document.getElementById('f_link').value = "";
      document.getElementById('f_cooldown').value = "";
    }

    function keluarAdmin() {
      localStorage.removeItem("adminLogin");
      location.reload(); // Muat ulang ke layar login
    }
  </script>
</body>
</html>
