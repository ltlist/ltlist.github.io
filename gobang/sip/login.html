<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard LTList</title>
  <link rel="stylesheet" href="dashb.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">LTList Admin</div>
    <div class="nav-actions">
      <a href="index.html" target="_blank" class="btn-site">Lihat Site</a>
      <button onclick="logout()">Logout</button>
    </div>
  </nav>

  <main class="container">
    <h1>Dashboard Admin</h1>

    <section class="add-form">
      <h2>Tambah Faucet Baru</h2>
      <div class="form-grid">
        <input id="name" placeholder="Nama Faucet" required>
        <input id="url" placeholder="URL Faucet https://..." required>
        <input id="min" placeholder="Min Withdraw" required>
        <input id="interval" placeholder="Interval" required>
        <select id="status">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
        <button onclick="addFaucet()">Tambah</button>
      </div>
    </section>

    <section>
      <h2>Daftar Faucet</h2>
      <div id="list" class="list"></div>
    </section>
  </main>

  <div id="toast"></div>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
