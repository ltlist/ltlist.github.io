<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard LTList</title>
  <link rel="stylesheet" href="dashb.css">
</head>
<body>

  <div class="navbar">
    <div class="logo">LTList Admin</div>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="container">
    <h1>Dashboard Admin</h1>

    <h2>Faucet List</h2>
    <input id="search" placeholder="Search nama, coin, atau rank..." onkeyup="searchFaucet()">

    <div id="list">Loading...</div>

    <hr style="margin:30px 0; border-color:#334155;">

    <h2>Add Faucet</h2>
    <input id="name" placeholder="Name" required>
    <input id="url" placeholder="URL" required>
    <input id="coin" placeholder="Coin (BTC/LTC/DOGE)" required>
    <input id="rank" type="number" placeholder="Rank, ex: 1">
    <button onclick="addFaucet()">Add</button>
  </div>

  <!-- MODAL EDIT -->
  <div id="editModal" class="modal">
    <div class="modal-box">
      <h2>Edit Faucet</h2>
      <input type="hidden" id="editId">
      <input id="editName" placeholder="Name">
      <input id="editUrl" placeholder="URL">
      <input id="editCoin" placeholder="Coin">
      <input id="editRank" type="number" placeholder="Rank">
      <select id="editStatus">
        <option value="active">active</option>
        <option value="inactive">inactive</option>
      </select>
      <div class="modal-actions">
        <button onclick="closeModal()">Batal</button>
        <button onclick="saveEdit()">Simpan</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
