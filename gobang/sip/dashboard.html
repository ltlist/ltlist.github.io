<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard LTList</title>

<link rel="stylesheet" href="dashb.css">
</head>

<body>

<div class="container">

  <div class="topbar">
    <h1>Dashboard Admin</h1>

    <button class="logout-btn" onclick="logout()">
      Logout
    </button>
<a href="https://ltlist.github.io/" target="_blank">
  <button class="btn-link">🌐 Open Website</button>
</a>
  </div>

  <div class="card">

    <h2>Faucet List</h2>

    <input
      id="search"
      placeholder="Search faucet..."
      onkeyup="searchFaucet()"
    >

    <div id="list"></div>

  </div>

  <div class="card">

    <h2>Add Faucet</h2>

    <input
      id="name"
      placeholder="Faucet Name"
    >

    <input
      id="url"
      placeholder="https://..."
    >

    <input
      id="coin"
      placeholder="Coin (LTC/BTC/DOGE/MULTI)"
    >

    <input
      id="rank"
      type="number"
      placeholder="Rank (1,2,3...)"
    >

    <button onclick="addFaucet()">
      Add Faucet
    </button>

  </div>

</div>

<script type="module" src="dashboard.js"></script>

</body>
</html>
