<!DOCTYPE html>
<html>
<head>
<title>Dashboard LTList</title>
</head>

<body style="font-family:Arial;background:#0f172a;color:white;padding:20px;">

<h1>Dashboard Admin</h1>

<p>Login berhasil 👍</p>

<button onclick="logout()">Logout</button>

<hr>

<!-- FAUCET LIST -->
<h2>Faucet List</h2>
<div id="list"></div>

<hr>

<!-- ADD FAUCET -->
<h2>Add Faucet</h2>

<input id="name" placeholder="Name"><br><br>
<input id="url" placeholder="URL"><br><br>
<input id="coin" placeholder="Coin"><br><br>

<button onclick="addFaucet()">Add</button>

<p id="msg"></p>

<!-- FIREBASE SCRIPT -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
  getFirestore, collection, getDocs, addDoc 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";


// 🔥 FIREBASE CONFIG (PUNYAMU)
const firebaseConfig = {
  apiKey: "AIzaSyAVokWj_l3aITEhj6UPetF-MGQXKdv75S8",
  authDomain: "ltlist-f.firebaseapp.com",
  projectId: "ltlist-f",
  storageBucket: "ltlist-f.firebasestorage.app",
  messagingSenderId: "991011425656",
  appId: "1:991011425656:web:d8f4da4e5c4b4ab9aacc8d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const listDiv = document.getElementById("list");
const msg = document.getElementById("msg");


// 🔥 LOAD FAUCETS
async function loadFaucets() {
  const snap = await getDocs(collection(db, "faucets"));

  let html = "";

  snap.forEach((doc) => {
    const d = doc.data();

    html += `
      <div style="background:#111827;padding:10px;margin:10px 0;border-radius:8px;">
        <b>${d.name}</b><br>
        Coin: ${d.coin}<br>
        <a href="${d.url}" target="_blank" style="color:#00ffcc;">Visit</a>
      </div>
    `;
  });

  listDiv.innerHTML = html;
}


// 🔥 ADD FAUCET
window.addFaucet = async function () {
  const name = document.getElementById("name").value;
  const url = document.getElementById("url").value;
  const coin = document.getElementById("coin").value;

  if(!name || !url || !coin){
    msg.innerText = "Isi semua data!";
    return;
  }

  await addDoc(collection(db, "faucets"), {
    name,
    url,
    coin,
    status: "active",
    created: Date.now()
  });

  msg.innerText = "Faucet berhasil ditambahkan ✔";

  loadFaucets();
};


// 🔥 LOGOUT
window.logout = function(){
  signOut(auth).then(() => {
    window.location.href = "login.html";
  });
}


// init
loadFaucets();

</script>

</body>
</html>
