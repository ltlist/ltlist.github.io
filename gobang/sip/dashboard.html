<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard LTList</title>
  <link rel="stylesheet" href="dashb.css">
</head>
<body>

  <nav class="navbar">
    <div class="logo">LTList Admin</div>
    <div class="nav-actions">
      <a href="https://ltlist.github.io/" target="_blank" rel="noopener" class="btn-site">Visit Site</a>
      <button onclick="logout()">Logout</button>
    </div>
  </nav>

  <main class="container">
    <h1>Dashboard Admin</h1>
<div style="margin:12px 0; display:flex; gap:8px;">
  <button id="publishBtn">📤 Publish JSON</button>
</div>
    <section>
      <h2>Daftar Faucet</h2>
      <input id="search" placeholder="Cari nama, coin, atau rank..." onkeyup="searchFaucet()">
      <div id="list" class="list">Loading...</div>
    </section>

    <hr>

    <section>
      <h2>Tambah Faucet</h2>
      <input id="name" placeholder="Nama" required>
      <input id="url" placeholder="URL https://..." required>
      <input id="coin" placeholder="Coin MULTI/BTC/LTC" required>
      <button onclick="addFaucet()">Tambah</button>
    </section>
  </main>

  <div id="editModal" class="modal">
    <div class="modal-box">
      <h2>Edit Faucet</h2>
      <input type="hidden" id="editId">
      <input id="editName" placeholder="Nama">
      <input id="editUrl" placeholder="URL">
      <input id="editCoin" placeholder="Coin">
      <select id="editStatus">
        <option value="active">active</option>
        <option value="inactive">inactive</option>
      </select>
      <div class="modal-actions">
        <button onclick="closeModal()">Batal</button>
        <button onclick="saveEdit()">Simpan</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
