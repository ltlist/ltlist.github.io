<!DOCTYPE html>
<html>
<head>
<title>Dashboard LTList</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Dashboard Admin</h1>

<button onclick="logout()">Logout</button>

<hr>

<h2>Faucet List</h2>
<input id="search" placeholder="Search..." onkeyup="searchFaucet()">

<div id="list"></div>

<hr>

<h2>Add Faucet</h2>

<div class="form">
  <input id="name" placeholder="Name">
  <input id="url" placeholder="URL">
  <input id="coin" placeholder="Coin (BTC/LTC/DOGE)">
  <button onclick="addFaucet()">Add</button>
</div>

<p id="msg"></p>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
