<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LTList Dashboard</title>

<link rel="stylesheet" href="dashb.css">
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="logo">LTList Admin</div>
  <a href="#" onclick="logout()">Logout</a>
</div>

<div class="container">

  <h1>Dashboard Faucet</h1>

  <input id="search" placeholder="Search..." onkeyup="searchFaucet()">

  <input id="name" placeholder="Name">
  <input id="url" placeholder="URL">
  <input id="coin" placeholder="Coin">
  <input id="rank" placeholder="Rank">

  <button onclick="addFaucet()">Add Faucet</button>

  <div id="list"></div>

</div>

<!-- MODAL EDIT -->
<div id="editModal" class="modal">
  <div class="modal-box">

    <h3>Edit Faucet</h3>

    <input id="editName" placeholder="Name">
    <input id="editUrl" placeholder="URL">
    <input id="editCoin" placeholder="Coin">
    <input id="editRank" placeholder="Rank">

    <select id="editStatus">
      <option value="active">active</option>
      <option value="inactive">inactive</option>
    </select>

    <div class="modal-actions">
      <button onclick="saveEdit()">Save</button>
      <button onclick="closeModal()">Cancel</button>
    </div>

  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script type="module" src="dashboard.js"></script>

</body>
</html>
