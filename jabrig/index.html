<!DOCTYPE html>
<html>
<head>
  <title>Jabrig Admin Panel</title>
  <style>
    body{
      font-family:Arial;
      background:#111;
      color:#fff;
      padding:20px;
    }

    input,button{
      padding:10px;
      margin:5px;
    }

    table{
      width:100%;
      margin-top:20px;
      border-collapse:collapse;
    }

    td,th{
      border:1px solid #444;
      padding:8px;
    }

    button{
      cursor:pointer;
    }

    .editBox{
      background:#222;
      padding:10px;
      margin-top:10px;
      display:none;
    }
  </style>
</head>
<body>

<h2>🔥 Faucet Admin Panel</h2>

<input id="id" placeholder="ID">
<input id="name" placeholder="Name">
<input id="coin" placeholder="Coin">
<input id="link" placeholder="Link">
<input id="cooldown" placeholder="Cooldown">

<button onclick="addData()">➕ Add</button>

<div class="editBox" id="editBox">
  <h3>Edit Data</h3>
  <input id="eid" placeholder="ID">
  <input id="ename" placeholder="Name">
  <input id="ecoin" placeholder="Coin">
  <input id="elink" placeholder="Link">
  <input id="ecooldown" placeholder="Cooldown">
  <button onclick="updateData()">💾 Save</button>
</div>

<table id="table"></table>

<script>
const API = "https://script.google.com/macros/s/AKfycbxKkaD-lLbceqsG0x1nWUu4ZFyNRdKaQ7FDn0YRtPM43i1I-J62g-bS8EPn6DmikZLZ/exec";

let editRow = null;

/* LOAD */
async function load(){
  let res = await fetch(API);
  let data = await res.json();

  let html = `
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Coin</th>
    <th>Link</th>
    <th>Cooldown</th>
    <th>Action</th>
  </tr>`;

  data.forEach(d=>{
    html += `
    <tr>
      <td>${d.id || ""}</td>
      <td>${d.name || ""}</td>
      <td>${d.coin || ""}</td>
      <td>${d.link || ""}</td>
      <td>${d.cooldown || ""}</td>
      <td>
        <button onclick='edit(${JSON.stringify(d)})'>Edit</button>
        <button onclick="hapus(${d.row})">Delete</button>
      </td>
    </tr>`;
  });

  document.getElementById("table").innerHTML = html;
}

/* ADD */
async function addData(){
  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"add",
      id:id.value,
      name:name.value,
      coin:coin.value,
      link:link.value,
      cooldown:cooldown.value
    })
  });

  load();
}

/* DELETE */
async function hapus(row){
  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"delete",
      row:row
    })
  });

  load();
}

/* EDIT */
function edit(d){
  editRow = d.row;

  document.getElementById("editBox").style.display = "block";

  eid.value = d.id;
  ename.value = d.name;
  ecoiin.value = d.coin;
  elink.value = d.link;
  ecooldown.value = d.cooldown;
}

/* UPDATE */
async function updateData(){
  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"update",
      row:editRow,
      id:eid.value,
      name:ename.value,
      coin:ecoin.value,
      link:elink.value,
      cooldown:ecooldown.value
    })
  });

  document.getElementById("editBox").style.display = "none";
  load();
}

load();
</script>

</body>
</html>
