<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Jabrig Admin Panel</title>

  <style>
    body{
      font-family:Arial;
      background:#111;
      color:#fff;
      padding:20px;
    }

    h2{ margin-bottom:10px; }

    input,button{
      padding:10px;
      margin:5px;
      border:none;
      border-radius:5px;
    }

    input{
      width:180px;
    }

    button{
      cursor:pointer;
    }

    table{
      width:100%;
      margin-top:20px;
      border-collapse:collapse;
    }

    th,td{
      border:1px solid #444;
      padding:8px;
      text-align:left;
    }

    .box{
      background:#1c1c1c;
      padding:10px;
      border-radius:8px;
    }

    #editBox{
      display:none;
      margin-top:20px;
      background:#222;
      padding:10px;
      border-radius:8px;
    }

    .btn-del{
      background:red;
      color:#fff;
    }

    .btn-edit{
      background:orange;
      color:#000;
    }

    .btn-add{
      background:green;
      color:#fff;
    }
  </style>
</head>

<body>

<h2>🔥 Jabrig Admin Panel</h2>

<div class="box">

  <input id="id" placeholder="ID">
  <input id="name" placeholder="Name">
  <input id="coin" placeholder="Coin">
  <input id="link" placeholder="Link">
  <input id="cooldown" placeholder="Cooldown">

  <button class="btn-add" onclick="addData()">➕ Add</button>

</div>

<!-- EDIT BOX -->
<div id="editBox">
  <h3>Edit Data</h3>

  <input id="eid" placeholder="ID">
  <input id="ename" placeholder="Name">
  <input id="ecoin" placeholder="Coin">
  <input id="elink" placeholder="Link">
  <input id="ecooldown" placeholder="Cooldown">

  <button class="btn-add" onclick="updateData()">💾 Save</button>
</div>

<table id="table"></table>

<script>

const API = "https://script.google.com/macros/s/AKfycbxAH3KI54-U-qrFUjsm5EesO4fjj3ZvKw7K86jgrg_snqpP7YSSMUzNPRusYYb7TQLx/exec";

let editRow = null;

/* ======================
   LOAD DATA
====================== */
async function load(){
  let res = await fetch(API);
  let data = await res.json();

  let html = `
  <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Coin</th>
    <th>Link</th>
    <th>Cooldown</th>
    <th>Action</th>
  </tr>`;

  data.forEach(d=>{
    html += `
    <tr>
      <td>${d.id || ""}</td>
      <td>${d.name || ""}</td>
      <td>${d.coin || ""}</td>
      <td>${d.link || ""}</td>
      <td>${d.cooldown || ""}</td>
      <td>
        <button class="btn-edit" onclick='edit(${JSON.stringify(d)})'>Edit</button>
        <button class="btn-del" onclick="hapus(${d.row})">Delete</button>
      </td>
    </tr>`;
  });

  document.getElementById("table").innerHTML = html;
}

/* ======================
   ADD DATA
====================== */
async function addData(){
  let form = new FormData();

  form.append("action","add");
  form.append("id",id.value);
  form.append("name",name.value);
  form.append("coin",coin.value);
  form.append("link",link.value);
  form.append("cooldown",cooldown.value);

  await fetch(API,{
    method:"POST",
    body:form
  });

  clearInput();
  load();
}

/* ======================
   DELETE
====================== */
async function hapus(row){
  let form = new FormData();

  form.append("action","delete");
  form.append("row",row);

  await fetch(API,{
    method:"POST",
    body:form
  });

  load();
}

/* ======================
   EDIT (OPEN FORM)
====================== */
function edit(d){
  editRow = d.row;

  document.getElementById("editBox").style.display = "block";

  document.getElementById("eid").value = d.id || "";
  document.getElementById("ename").value = d.name || "";
  document.getElementById("ecoin").value = d.coin || "";
  document.getElementById("elink").value = d.link || "";
  document.getElementById("ecooldown").value = d.cooldown || "";
}

/* ======================
   UPDATE DATA
====================== */
async function updateData(){
  let form = new FormData();

  form.append("action","update");
  form.append("row",editRow);
  form.append("id",eid.value);
  form.append("name",ename.value);
  form.append("coin",ecoin.value);
  form.append("link",elink.value);
  form.append("cooldown",ecooldown.value);

  await fetch(API,{
    method:"POST",
    body:form
  });

  document.getElementById("editBox").style.display = "none";
  load();
}

/* ======================
   CLEAR INPUT
====================== */
function clearInput(){
  id.value="";
  name.value="";
  coin.value="";
  link.value="";
  cooldown.value="";
}

load();

</script>

</body>
</html>
